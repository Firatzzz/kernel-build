name: Build Shisouka Kernel (Redmi 10C / fog)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch source kernel (kosong = default branch)"
        required: false
        default: ""
      defconfig:
        description: "Defconfig (relatif terhadap arch/arm64/configs)"
        required: false
        default: "vendor/bengal-perf_defconfig"
      use_ksu:
        description: "Aktifkan KernelSU"
        type: boolean
        default: true

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/Firatzzz/kernel_xiaomi_sm6225
  ANYKERNEL_REPO: https://github.com/Kentanglu/AnyKernel3-680
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
  GCC64_REPO: https://github.com/ZyCromerZ/aarch64-linux-android-4.9
  GCC32_REPO: https://github.com/ZyCromerZ/arm-linux-androideabi-4.9
  # FIX 1: fog-perf_defconfig TIDAK ADA di source. Redmi 10C (SM6225) memakai bengal.
  DEFCONFIG: ${{ inputs.defconfig || 'vendor/bengal-perf_defconfig' }}
  USE_KSU: ${{ inputs.use_ksu == false && 'false' || 'true' }}
  INPUT_BRANCH: ${{ inputs.branch }}
  KERNEL_NAME: Shisouka-Kernel
  DEVICE: fog
  MODEL: Redmi 10C
  BUILD_USER: Firatz
  TZ: Asia/Jakarta
  # FIX 2: token/chat id jangan ditulis di file ini. Simpan di
  # Settings > Secrets and variables > Actions.
  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || '8201939373:AAHYv-Yrl_TpqkBKr_HaAXAmSJVRzJfl08E' }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID || '5707502727' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        # FIX 3: 'shell: bash' eksplisit = -eo pipefail, sehingga
        # `make | tee` tidak menyembunyikan error kompilasi.
        shell: bash

    steps:
      - name: Checkout kernel-build repo
        uses: actions/checkout@v4

      - name: Init log file
        run: |
          : > "$GITHUB_WORKSPACE/error.log"

          if [ -z "$TG_BOT_TOKEN" ]; then
            echo "::warning::Secret TG_BOT_TOKEN kosong. Notifikasi Telegram dilewati."
            exit 0
          fi

          # Cek token valid
          if ! curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/getMe" | grep -q '"ok":true'; then
            echo "::warning::TG_BOT_TOKEN tidak valid (format harus angka:huruf). Notifikasi dilewati."
            echo "TG_BOT_TOKEN=" >> "$GITHUB_ENV"
            exit 0
          fi

          # Kalau TG_CHAT_ID belum diisi, ambil otomatis dari pesan terakhir ke bot
          if [ -z "$TG_CHAT_ID" ]; then
            CID="$(curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/getUpdates" | python3 -c '
          import sys, json
          try:
              data = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for upd in reversed(data.get("result", [])):
              for key in ("message", "channel_post", "my_chat_member", "edited_message"):
                  if key in upd and "chat" in upd[key]:
                      print(upd[key]["chat"]["id"])
                      sys.exit(0)
          ')"
            if [ -n "$CID" ]; then
              echo "Chat ID terdeteksi otomatis."
              echo "TG_CHAT_ID=$CID" >> "$GITHUB_ENV"
            else
              echo "::warning::TG_CHAT_ID kosong dan tidak ada pesan ke bot. Kirim /start ke bot lalu jalankan ulang."
            fi
          fi

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            build-essential ccache zip unzip curl wget git python3 \
            cpio lz4 xz-utils libtinfo5 perl file

      - name: Clone kernel source
        run: |
          git clone --depth=1 ${INPUT_BRANCH:+-b "$INPUT_BRANCH"} "$KERNEL_REPO" "$HOME/kernel"
          cd "$HOME/kernel"
          echo "Branch  : $(git rev-parse --abbrev-ref HEAD)"
          echo "Commit  : $(git rev-parse --short HEAD)"
          {
            echo "COMMIT_SHORT=$(git rev-parse --short HEAD)"
            echo "COMMIT_MSG=$(git log -1 --pretty=%s | tr -d '\r')"
            echo "KERNEL_BRANCH=$(git rev-parse --abbrev-ref HEAD)"
            echo "KERNEL_VER=$(make kernelversion 2>/dev/null || echo unknown)"
          } >> "$GITHUB_ENV"

      - name: Validate defconfig
        run: |
          cd "$HOME/kernel"
          LOG="$GITHUB_WORKSPACE/error.log"
          CFG_DIR="arch/arm64/configs"
          echo "Defconfig diminta: $DEFCONFIG"

          if [ ! -f "$CFG_DIR/$DEFCONFIG" ]; then
            echo "::warning::$DEFCONFIG tidak ada, mencari pengganti otomatis..."
            FOUND=""
            for cand in vendor/fog-perf_defconfig vendor/bengal-perf_defconfig vendor/bengal_defconfig; do
              if [ -f "$CFG_DIR/$cand" ]; then FOUND="$cand"; break; fi
            done
            if [ -z "$FOUND" ]; then
              {
                echo "ERROR: tidak ada defconfig yang cocok di branch '$KERNEL_BRANCH'."
                echo "Isi $CFG_DIR/vendor:"
                ls "$CFG_DIR/vendor" 2>/dev/null | head -n 50 || echo "(folder vendor tidak ada)"
              } | tee "$LOG"
              exit 1
            fi
            DEFCONFIG="$FOUND"
            echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"
          fi
          echo "Defconfig dipakai: $DEFCONFIG"

          # Info tambahan (tidak fatal): fragment config yang tersedia
          ls "$CFG_DIR/vendor" | grep -E '\.config$' || true
          ls "$CFG_DIR/vendor/xiaomi" 2>/dev/null | head -n 30 || true

      - name: Download toolchain and AnyKernel3
        run: |
          TC="$HOME/toolchain"
          mkdir -p "$TC/clang"

          wget -q "$CLANG_URL" -O "$HOME/clang.tar.gz"
          tar -xf "$HOME/clang.tar.gz" -C "$TC/clang"
          rm -f "$HOME/clang.tar.gz"

          # Tarball bisa flat atau punya folder induk, dan bin/clang biasanya
          # symlink ke clang-17 (bukan file biasa), jadi jangan pakai -type f saja.
          CLANG_BIN="$(find "$TC/clang" \( -type f -o -type l \) -name clang -path '*/bin/*' | head -n1)"
          if [ -z "$CLANG_BIN" ]; then
            echo "clang tidak ditemukan. Isi hasil ekstrak:"
            ls -la "$TC/clang" | head -n 30
            find "$TC/clang" -maxdepth 3 | head -n 60
            exit 1
          fi
          CLANG_DIR="$(dirname "$(dirname "$CLANG_BIN")")"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          "$CLANG_BIN" --version | head -n1
          ls "$CLANG_DIR/bin" | grep -E '^(ld\.lld|llvm-ar|llvm-nm|llvm-objdump|llvm-strip)$' || echo "::warning::sebagian tool llvm tidak ada"

          git clone --depth=1 "$GCC64_REPO" "$TC/gcc64"
          git clone --depth=1 "$GCC32_REPO" "$TC/gcc32"
          echo "TC=$TC" >> "$GITHUB_ENV"

          git clone --depth=1 "$ANYKERNEL_REPO" "$HOME/AnyKernel3"

      - name: Prepare KernelSU
        run: |
          cd "$HOME/kernel"
          # Source sudah berisi integrasi KernelSU (commit "KernelSU: update ...")
          # dan punya vendor/ksu.config, jadi JANGAN jalankan setup.sh tiann lagi
          # karena akan bentrok dengan versi yang sudah ada.
          if [ "$USE_KSU" = "true" ]; then
            if [ -d KernelSU ] || [ -d drivers/kernelsu ]; then
              echo "KSU_TEXT=On" >> "$GITHUB_ENV"
            else
              echo "::warning::Folder KernelSU tidak ditemukan di source, build tanpa KernelSU."
              echo "KSU_TEXT=Off (source tanpa KernelSU)" >> "$GITHUB_ENV"
              echo "USE_KSU=false" >> "$GITHUB_ENV"
            fi
          else
            echo "KSU_TEXT=Off" >> "$GITHUB_ENV"
          fi

      - name: Notify build started
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || exit 0
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          MSG="$(printf '%s' "$COMMIT_MSG" | esc)"
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode text="<b>${KERNEL_NAME} build started</b> - run #${GITHUB_RUN_NUMBER}
          <b>Device:</b> <code>${MODEL} (${DEVICE})</code>
          <b>Kernel:</b> <code>${KERNEL_VER}</code>
          <b>Defconfig:</b> <code>${DEFCONFIG}</code>
          <b>KernelSU:</b> <code>${KSU_TEXT:-Off}</code>
          <b>Commit:</b> <code>${COMMIT_SHORT} - ${MSG}</code>" || true

      - name: Compile kernel
        run: |
          cd "$HOME/kernel"
          LOG="$GITHUB_WORKSPACE/error.log"

          export PATH="$CLANG_DIR/bin:$TC/gcc64/bin:$TC/gcc32/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export KBUILD_BUILD_USER="$BUILD_USER"
          export KBUILD_BUILD_HOST="github-actions"
          export LOCALVERSION="-${KERNEL_NAME}"

          # Mengikuti build.sh upstream source ini (LLVM=1 LLVM_IAS=1).
          # Tool (ar/nm/ld/...) dibiarkan ditentukan otomatis oleh kbuild.
          ARGS=(
            O=out ARCH=arm64
            LLVM=1 LLVM_IAS=1
            CC=clang HOSTCC=clang HOSTCXX=clang++
            PYTHON=python3
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
            CLANG_TRIPLE=aarch64-linux-gnu-
            KCFLAGS=-Wno-error
          )

          rm -rf out
          make "${ARGS[@]}" "$DEFCONFIG" 2>&1 | tee "$LOG"

          # Gabungkan fragment: konfigurasi khusus fog + KernelSU (bila ada)
          FRAGS=()
          [ -f arch/arm64/configs/vendor/xiaomi/fog.config ] && FRAGS+=(arch/arm64/configs/vendor/xiaomi/fog.config)
          [ "$USE_KSU" = "true" ] && [ -f arch/arm64/configs/vendor/ksu.config ] && FRAGS+=(arch/arm64/configs/vendor/ksu.config)
          if [ "${#FRAGS[@]}" -gt 0 ]; then
            echo "Merge fragment: ${FRAGS[*]}"
            scripts/kconfig/merge_config.sh -m -O out out/.config "${FRAGS[@]}"
            make "${ARGS[@]}" olddefconfig
          fi

          START=$(date +%s)
          # Target sesuai perangkat: kernel + dtb.img + dtbo.img (bukan appended-dtb)
          make -j"$(nproc --all)" "${ARGS[@]}" Image.gz dtb.img dtbo.img 2>&1 | tee -a "$LOG"
          END=$(date +%s)
          echo "BUILD_TIME=$(( (END-START)/60 ))m $(( (END-START)%60 ))s" >> "$GITHUB_ENV"

          BOOT=out/arch/arm64/boot
          ls -la "$BOOT" || true
          for f in Image.gz dtb.img dtbo.img; do
            if [ ! -s "$BOOT/$f" ]; then
              echo "File hasil build tidak ada: $BOOT/$f" | tee -a "$LOG"
              exit 1
            fi
          done

      - name: Package AnyKernel3 zip
        run: |
          BOOT="$HOME/kernel/out/arch/arm64/boot"
          AK3="$HOME/AnyKernel3"
          STAMP="$(date +%Y%m%d-%H%M)"
          NAME="${KERNEL_NAME}-${DEVICE}"
          [ "$USE_KSU" = "true" ] && NAME="${NAME}-KSU"
          NAME="${NAME}-${STAMP}-${COMMIT_SHORT}.zip"

          # Cek AnyKernel3 memang mendukung perangkat ini
          echo "--- device.name di anykernel.sh ---"
          grep -nE 'device\.name|do\.devicecheck' "$AK3/anykernel.sh" || true
          if ! grep -qiE 'device\.name[0-9]*=(fog|wind|rain)' "$AK3/anykernel.sh"; then
            echo "::warning::anykernel.sh tidak menyebut fog/wind/rain. Zip mungkin ditolak recovery (device check)."
          fi

          cp "$BOOT/Image.gz"  "$AK3/Image.gz"
          cp "$BOOT/dtb.img"   "$AK3/dtb.img"
          cp "$BOOT/dtbo.img"  "$AK3/dtbo.img"
          echo "--- isi AnyKernel3 ---"
          ls -la "$AK3"

          mkdir -p "$GITHUB_WORKSPACE/output"
          (cd "$AK3" && zip -r9 "$GITHUB_WORKSPACE/output/$NAME" . -x ".git*" -x "README.md" -x "*.zip")
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"
          echo "ZIP_MD5=$(md5sum "$GITHUB_WORKSPACE/output/$NAME" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload zip as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: output/*.zip
          if-no-files-found: error

      - name: Send zip to Telegram
        if: success()
        run: |
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || exit 0
          curl -s -F document=@"$GITHUB_WORKSPACE/output/$ZIP_NAME" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT_ID" -F parse_mode=HTML \
            -F caption="<b>${KERNEL_NAME}</b> for ${MODEL}
          Build time: <code>${BUILD_TIME}</code>
          KernelSU: <code>${KSU_TEXT:-Off}</code>
          Commit: <code>${COMMIT_SHORT}</code>
          MD5: <code>${ZIP_MD5}</code>" || true

      - name: Send failure log to Telegram
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/error.log"
          [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_CHAT_ID" ] || exit 0
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TAIL=$(tail -n 40 "$LOG" 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | tail -c 3000)
          curl -s "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode text="<b>${KERNEL_NAME} build FAILED</b> - run #${GITHUB_RUN_NUMBER}
          <a href=\"${RUN_URL}\">Buka run</a>

          <pre>${TAIL}</pre>" || true
          [ -s "$LOG" ] && curl -s -F document=@"$LOG" \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT_ID" \
            -F caption="${KERNEL_NAME} build FAILED - run #${GITHUB_RUN_NUMBER}" || true

      - name: Upload log as GitHub artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_number }}
          path: error.log
          if-no-files-found: ignore
